# SPDX-License-Identifier: Apache-2.0
name: autoisa-program-gate

on:
  pull_request:
  push:
    branches:
      - master
      - autoisa-rtl-capability-v1
  workflow_dispatch:

concurrency:
  group: autoisa-program-gate-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  g3-program-elf:
    # Keep the established check name because branch protection requires it.
    name: AutoISA G3 / Minimal ELF
    # Never execute untrusted fork code on the licensed self-hosted machine.
    # A maintainer must mirror an external contribution to a same-repository
    # branch before it can receive the G3 result.
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, Windows, X64, autoisa-vivado]
    timeout-minutes: 20
    env:
      AUTOISA_PYTHON: ${{ vars.AUTOISA_PYTHON }}
      AUTOISA_VIVADO_BIN: ${{ vars.AUTOISA_VIVADO_BIN }}
      AUTOISA_RISCV_TOOLCHAIN: ${{ vars.AUTOISA_RISCV_TOOLCHAIN }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Validate runner tools
        shell: powershell
        run: |
          $required = @(
            $env:AUTOISA_PYTHON,
            (Join-Path $env:AUTOISA_VIVADO_BIN 'xvlog.bat'),
            (Join-Path $env:AUTOISA_RISCV_TOOLCHAIN 'bin/riscv-none-elf-gcc.exe')
          )
          foreach ($path in $required) {
            if (-not $path -or -not (Test-Path -LiteralPath $path)) {
              throw "Required G3 runner tool is missing: $path"
            }
          }
          & $env:AUTOISA_PYTHON --version

      - name: Validate gate orchestration
        shell: powershell
        run: >-
          & $env:AUTOISA_PYTHON -m unittest -v
          tests.autoisa.test_g3_gate
          tests.autoisa.test_cva6_warnings

      - name: Run blocking G3 gate
        shell: powershell
        run: '& $env:AUTOISA_PYTHON ci/autoisa/run_g3_gate.py'

      - name: Upload G3 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: autoisa-g3-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: warn
          retention-days: 30
          path: |
            ci/autoisa/build/g3_gate_summary.json
            ci/autoisa/build/elf_*.log
            ci/autoisa/build/software/program_coverage.elf
            ci/autoisa/build/software/program_coverage.dump
            trace_hart_0.log
