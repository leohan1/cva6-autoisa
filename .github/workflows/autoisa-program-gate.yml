# SPDX-License-Identifier: Apache-2.0
name: autoisa-program-gate

on:
  pull_request:
  push:
    branches:
      - master
      - autoisa-rtl-capability-v1
  workflow_dispatch:

concurrency:
  group: autoisa-program-gate-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  g3-minimal-elf:
    name: AutoISA G3 / Minimal ELF
    # Never execute untrusted fork code on the licensed self-hosted machine.
    # A maintainer must mirror an external contribution to a same-repository
    # branch before it can receive the G3 result.
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, Windows, X64, autoisa-vivado]
    timeout-minutes: 20
    env:
      AUTOISA_VIVADO_BIN: ${{ vars.AUTOISA_VIVADO_BIN }}
      AUTOISA_RISCV_TOOLCHAIN: ${{ vars.AUTOISA_RISCV_TOOLCHAIN }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Validate gate orchestration
        shell: pwsh
        run: python -m unittest -v tests.autoisa.test_g3_gate

      - name: Run blocking G3 gate
        shell: pwsh
        run: python ci/autoisa/run_g3_gate.py

      - name: Upload G3 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: autoisa-g3-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: warn
          retention-days: 30
          path: |
            ci/autoisa/build/g3_gate_summary.json
            ci/autoisa/build/elf_*.log
            ci/autoisa/build/software/minimal_d0.elf
            ci/autoisa/build/software/minimal_d0.dump
            trace_hart_0.log
